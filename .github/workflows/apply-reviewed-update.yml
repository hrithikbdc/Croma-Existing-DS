name: Apply reviewed developer update
on:
  push:
    paths: ['.github/workflows/apply-reviewed-update.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/developer-handoff-0.6.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact reviewed update and apply to review branch
        run: |
          git merge-base --is-ancestor 434c74777092e15ee61f0e2cd75fed61743fdcea HEAD
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path,PurePosixPath
          raw=Path('croma-developer-update.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='32acdfb3a4203d9cefd8185c94076167736cf0334c8df311c4f1e65861585531'
          assert json.loads(Path('package.json').read_text())['version']=='0.5.1'
          files=json.loads(raw)
          assert len(files)==142
          for name,content in files.items():
              p=PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] not in ['.git','node_modules','releases']
              assert not name.endswith('.fig')
              if name.startswith('.github/workflows/'):
                  assert name in ['.github/workflows/quality.yml','.github/workflows/release.yml']
                  continue  # Workflow files are committed through the signed-in browser.
              target=Path(name)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content)
          assert json.loads(Path('package.json').read_text())['version']=='0.6.0'
          Path('croma-developer-update.json').unlink()
          # The signed-in browser removes this helper after successful application.
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Add self-service React documentation, theme setup and developer acceptance checks'
          git push origin HEAD:developer-handoff-0.6.0
